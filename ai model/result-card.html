<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop diagnosis result card</title>
<style>
  :root {
    --soil-900: #2B2118;
    --soil-700: #4A3B2C;
    --soil-500: #7A6650;
    --soil-200: #E4DACB;
    --soil-100: #F1ECE1;
    --leaf-700: #2F5233;
    --leaf-500: #4C7A4F;
    --leaf-100: #E4EEDF;
    --rust-700: #8C3A26;
    --rust-500: #B9532F;
    --rust-100: #F5E4DB;
    --amber-700: #8A5A12;
    --amber-500: #C1841F;
    --amber-100: #F6EAD3;
    --paper: #FDFCF9;
    --line: #DEDACE;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--soil-100);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    color: var(--soil-900);
    padding: 32px 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    max-width: 480px;
    width: 100%;
    overflow: hidden;
  }

  /* ---- header ---- */
  .card-header {
    display: flex;
    gap: 14px;
    padding: 20px 22px 18px;
    border-bottom: 1px solid var(--line);
  }
  .thumb {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--leaf-100);
    border: 1px solid var(--line);
  }
  .header-text { min-width: 0; flex: 1; }
  .crop-name { font-size: 13px; color: var(--soil-500); margin: 0 0 2px; }
  .disease-name {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 8px;
    line-height: 1.25;
  }
  .severity-row { display: flex; align-items: center; gap: 8px; }
  .severity-pill {
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .sev-low { background: var(--leaf-100); color: var(--leaf-700); }
  .sev-medium { background: var(--amber-100); color: var(--amber-700); }
  .sev-high { background: var(--rust-100); color: var(--rust-700); }

  /* ---- confidence ---- */
  .confidence-block { padding: 16px 22px; border-bottom: 1px solid var(--line); }
  .confidence-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--soil-700);
    margin-bottom: 6px;
  }
  .confidence-track {
    height: 6px;
    background: var(--soil-200);
    border-radius: 100px;
    overflow: hidden;
  }
  .confidence-fill { height: 100%; background: var(--leaf-500); border-radius: 100px; }
  .alt-toggle {
    background: none;
    border: none;
    color: var(--soil-500);
    font-size: 12px;
    padding: 8px 0 0;
    cursor: pointer;
    text-decoration: underline;
    font-family: inherit;
  }
  .alt-list { margin: 8px 0 0; padding: 0; list-style: none; display: none; }
  .alt-list.open { display: block; }
  .alt-list li {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--soil-700);
    padding: 4px 0;
  }

  /* ---- info sections ---- */
  .section {
    display: flex;
    gap: 12px;
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
  }
  .section:last-of-type { border-bottom: none; }
  .section-icon {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .section-icon svg { width: 16px; height: 16px; }
  .icon-cause { background: var(--rust-100); color: var(--rust-700); }
  .icon-symptoms { background: var(--amber-100); color: var(--amber-700); }
  .icon-treatment { background: var(--leaf-100); color: var(--leaf-700); }
  .icon-organic { background: var(--leaf-100); color: var(--leaf-700); }
  .icon-prevention { background: var(--soil-200); color: var(--soil-700); }
  .icon-recovery { background: var(--soil-200); color: var(--soil-700); }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    margin: 0 0 3px;
    color: var(--soil-900);
  }
  .section-text {
    font-size: 14px;
    line-height: 1.5;
    color: var(--soil-700);
    margin: 0;
  }

  /* ---- ask follow-up ---- */
  .ask-block { padding: 18px 22px 22px; }
  .ask-row { display: flex; gap: 8px; }
  .ask-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    background: var(--soil-100);
  }
  .ask-input:focus { outline: 2px solid var(--leaf-500); outline-offset: 1px; }
  .ask-button {
    background: var(--leaf-700);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 0 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .ask-button:hover { background: var(--leaf-500); }
  .ask-answer {
    margin-top: 12px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--soil-700);
    background: var(--soil-100);
    border-radius: 8px;
    padding: 12px 14px;
    display: none;
  }
  .ask-answer.open { display: block; }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="card-header">
    <img class="thumb" id="thumb" alt="Uploaded leaf photo">
    <div class="header-text">
      <p class="crop-name" id="crop-name"></p>
      <h2 class="disease-name" id="disease-name">Awaiting diagnosis…</h2>
      <div class="severity-row">
        <span class="severity-pill" id="severity-pill"></span>
      </div>
    </div>
  </div>

  <div class="confidence-block">
    <div class="confidence-label">
      <span>Model confidence</span>
      <span id="confidence-value">—</span>
    </div>
    <div class="confidence-track"><div class="confidence-fill" id="confidence-fill" style="width:0%"></div></div>
    <button class="alt-toggle" id="alt-toggle" onclick="document.getElementById('alt-list').classList.toggle('open')">Show other possibilities</button>
    <ul class="alt-list" id="alt-list"></ul>
  </div>

  <div class="section">
    <div class="section-icon icon-cause"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg></div>
    <div>
      <p class="section-title">Cause</p>
      <p class="section-text" id="cause-text"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-icon icon-symptoms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 7v10l8 5 8-5V7z"/></svg></div>
    <div>
      <p class="section-title">Symptoms</p>
      <p class="section-text" id="symptoms-text"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-icon icon-treatment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 2v6l-5 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V2"/><path d="M8 2h8"/></svg></div>
    <div>
      <p class="section-title">Treatment</p>
      <p class="section-text" id="treatment-text"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-icon icon-organic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5-2 8-6 8-12V5l-8-3-8 3v5c0 6 3 10 8 12Z"/></svg></div>
    <div>
      <p class="section-title">Organic alternative</p>
      <p class="section-text" id="organic-text"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-icon icon-prevention"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg></div>
    <div>
      <p class="section-title">Prevention</p>
      <p class="section-text" id="prevention-text"></p>
    </div>
  </div>

  <div class="section">
    <div class="section-icon icon-recovery"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg></div>
    <div>
      <p class="section-title">Expected recovery</p>
      <p class="section-text" id="recovery-text"></p>
    </div>
  </div>

  <div class="ask-block">
    <div class="ask-row">
      <input class="ask-input" id="ask-input" placeholder="Ask a follow-up, e.g. is this safe near flowering plants?">
      <button class="ask-button" onclick="askFollowUp()">Ask</button>
    </div>
    <div class="ask-answer" id="ask-answer"></div>
  </div>
</div>

<script>
/*
  HOW TO WIRE THIS TO YOUR BACKEND
  ---------------------------------
  1. renderResult(data) below expects the JSON shape returned by POST /diagnose:
     {
       class, confidence, crop, disease, top3: [{class, confidence}, ...],
       report: { cause, symptoms, treatment, organic_alternative,
                 prevention, recovery_time, severity }
     }

  2. After you upload the photo and get the response, call:
     renderResult(data, imageObjectUrl)

  3. The "Ask" box calls POST /ask with { question } and shows the answer inline.
     Swap API_BASE below for your real backend URL.
*/

const API_BASE = "http://localhost:8000"; // change to your deployed backend URL

const CONFIDENCE_LABEL_TO_PCT = { low: 40, medium: 70, high: 92 };

function renderResult(data, imageUrl) {
  document.getElementById("thumb").src = imageUrl || "";
  document.getElementById("crop-name").textContent = data.crop || "";
  document.getElementById("disease-name").textContent = data.disease || data.class;

  // Supports both a numeric 0-1 confidence (trained-model version) and a
  // label like "low"/"medium"/"high" (vision-LLM version).
  let pct;
  if (typeof data.confidence === "number") {
    pct = Math.round(data.confidence * 100);
  } else {
    const label = (data.confidence_label || "medium").toLowerCase();
    pct = CONFIDENCE_LABEL_TO_PCT[label] ?? 70;
  }
  document.getElementById("confidence-value").textContent = pct + "%";
  document.getElementById("confidence-fill").style.width = pct + "%";

  // Alternative-guesses list only applies to the trained-model version;
  // hide the toggle entirely when top3 isn't present.
  const altToggle = document.getElementById("alt-toggle");
  const altList = document.getElementById("alt-list");
  if (data.top3 && data.top3.length > 1) {
    altToggle.style.display = "";
    altList.innerHTML = data.top3
      .slice(1)
      .map(alt => `<li><span>${alt.class.replace("___", ", ").replace(/_/g, " ")}</span><span>${Math.round(alt.confidence * 100)}%</span></li>`)
      .join("");
  } else {
    altToggle.style.display = "none";
  }

  const r = data.report || {};
  document.getElementById("cause-text").textContent = r.cause || "Not available";
  document.getElementById("symptoms-text").textContent = r.symptoms || "Not available";
  document.getElementById("treatment-text").textContent = r.treatment || "Not available";
  document.getElementById("organic-text").textContent = r.organic_alternative || "Not available";
  document.getElementById("prevention-text").textContent = r.prevention || "Not available";
  document.getElementById("recovery-text").textContent = r.recovery_time || "Not available";

  const pill = document.getElementById("severity-pill");
  const sev = (r.severity || "medium").toLowerCase();
  pill.className = "severity-pill sev-" + sev;
  pill.textContent = sev.charAt(0).toUpperCase() + sev.slice(1) + " severity";
}

async function askFollowUp() {
  const input = document.getElementById("ask-input");
  const answerBox = document.getElementById("ask-answer");
  if (!input.value.trim()) return;

  answerBox.textContent = "Thinking...";
  answerBox.classList.add("open");

  try {
    const form = new FormData();
    form.append("question", input.value);
    const res = await fetch(`${API_BASE}/ask`, { method: "POST", body: form });
    const data = await res.json();
    answerBox.textContent = data.answer;
  } catch (err) {
    answerBox.textContent = "Couldn't reach the server. Check your connection and try again.";
  }
}

// Wire this to your real upload flow: after POST-ing the image to
// {API_BASE}/diagnose, call renderResult(data, imageObjectUrl) with the
// JSON response you get back.

</script>

</body>
</html>
